[project]
name = "explainer"
version = "0.1.0"
description = "Predictor's plain-English match explainer: our numbers and free headlines, written up by an OpenRouter model, with a template fallback."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "pandas>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["explainer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `slow` is not "skipped": it runs by default in CI. It marks the tests that wait
# out a real deadline on purpose -- the deploy health probe against a target that
# never answers -- so that the number they print is a measurement and not a
# claim, and so that deleting a bound shows up as a test that gets slower.
markers = [
    "slow: waits out a real deadline on purpose; runs by default",
]
