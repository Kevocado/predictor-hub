[project]
name = "explainer"
version = "0.1.0"
description = "Predictor's plain-English match explainer: our numbers and free headlines, written up by an OpenRouter model, with a template fallback."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["explainer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
