name: Deploy hub

# A merge to main that changes a file the hub site serves deploys it to the VPS.
# The paths filter is a whitelist of what the site serves: data/** is absent on
# purpose, because the paper and snapshot bots commit to main several times a
# day and the pages read their data from raw.githubusercontent.com at runtime,
# so a data commit must not redeploy.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'paper.html'
      - 'teasers.js'
      - 'tools/**'
      - '.github/workflows/deploy-hub.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy hub to the VPS
    # A manual run from another branch would deploy that branch's code to production.
    if: github.ref == 'refs/heads/main' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    # One hub deploy at a time; bin/deploy also takes its own lock on the box.
    concurrency: vps-deploy-hub
    steps:
      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh deploy@${{ vars.VPS_HOST }} hub ${{ github.sha }}
