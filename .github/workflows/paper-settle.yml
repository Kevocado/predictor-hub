name: Settle paper rows

# Mark open ledger rows settled from Kalshi's own resolution, then refresh the
# report. PAPER ONLY: no orders, no credentials.
#
# Kalshi finalizes a market shortly after the event, and the collectors re-pull
# recently settled markets on each run, so settlement needs no feed of its own —
# it only has to run after the collectors have committed. Games run Sun-Thu
# evening US time, so the results land in the small hours UTC; three passes a day
# keeps a settled row from sitting open for a day. Settlement is idempotent, so a
# run that has nothing to do writes nothing and costs nothing.
#
# The retry loop is copied from NFL_Predictor's b784e56, for the same reason as in
# paper-log.yml: a non-fast-forward on a shared branch is a normal race, not a
# broken build.

on:
  schedule:
    - cron: "20 4 * * *"
    - cron: "20 12 * * *"
    - cron: "20 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check out every site repo that collects Kalshi ladders
        # Every repo the ledger reads ladders from: NFL_Predictor (player-prop
        # series), NBA_Predictor (game markets), PL_Predictor (EPL game and
        # total markets), CFB_Predictor (college-football game, spread and
        # total markets) and F1_Predictor (the F1 driver contracts).
        #
        # The list is the ledger's own (services/paper/paper/sources.py
        # SITE_FOR_SPORT), so a sport added there is added here by the test
        # tests/paper-workflows.test.mjs rather than by remembering.
        #
        # EVERY one of these repos must HAVE a collector, or the run below fails
        # rather than silently skipping a sport: a sport whose collector is
        # missing reads as "no markets today", which is a different claim from
        # "no collector", and the ledger's counts are then wrong in a way
        # nothing shows. That is why the collectors land FIRST -- if this
        # workflow reaches a repo with no data/lines, paper_log.py exits 3 and
        # the ledger freezes. All five have both a collector workflow and
        # committed data/lines.
        #
        # Shallow on purpose and tracking main on purpose: this reads what those
        # repos ship, not a pinned commit, so a new committed ladder is picked up
        # the next time this runs. All are public.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sites"
          for repo in NFL_Predictor NBA_Predictor PL_Predictor CFB_Predictor F1_Predictor; do
            echo "cloning $repo"
            git clone --quiet --depth 1 --branch main \
              "https://github.com/Kevocado/$repo.git" "$RUNNER_TEMP/sites/$repo"
          done
          # A clone that failed must not read as "this sport has no markets".
          # `set -e` catches a failed clone, but the loop's own exit status is
          # the LAST command's, so an earlier failure would be invisible.
          for repo in NFL_Predictor NBA_Predictor PL_Predictor CFB_Predictor F1_Predictor; do
            if [ ! -d "$RUNNER_TEMP/sites/$repo" ]; then
              echo "::error::could not check out $repo; the ledger would skip it silently"
              exit 1
            fi
          done
      - name: Settle
        # A missing collector is an error here, not an empty result: the
        # ledger would otherwise settle the sports whose collectors are present
        # and silently skip the one whose is not, leaving rows open that should
        # have settled and reporting them as "unresolved".
        env:
          SITES_ROOT: ${{ runner.temp }}/sites
        run: python3 scripts/paper_settle.py
      - name: Refresh the report
        env:
          SITES_ROOT: ${{ runner.temp }}/sites
        run: python3 scripts/paper_report.py
      - name: Commit and push if changed
        # Only on a green run. A red run must not publish a partial ledger: the
        # report is regenerated from the same rows, so a failed step that still
        # committed would put a report on the branch that does not match the
        # ledger, and the next run would read it as the truth.
        if: success()
        run: |
          if [ -z "$(git status --porcelain data/paper)" ]; then echo "nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper
          git commit -m "Settle paper rows [automated]"
          for attempt in 1 2 3 4; do
            git pull --rebase -q -X theirs && git push && exit 0
            echo "push attempt $attempt failed; retrying"; sleep $((attempt * 5))
          done
          exit 1
