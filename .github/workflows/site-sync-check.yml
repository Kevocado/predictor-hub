name: Vendored UI is current

# Is every site's vendored copy of packages/predictor-ui the one this commit
# would vendor? Each site runs its own drift test, and each one compares the
# copy against the site's *own* SYNC.json — so it catches a hand edit and is
# blind to this. That is how sites sat at an old version with every suite in
# every repo green. See scripts/check-site-sync.mjs for why the check has to
# live in the hub rather than in a site.
#
# This is the only job in CI, and it is deliberately only this job. The rest of
# the suites run locally; wiring them up is a separate change, and folding it in
# here would make a red run ambiguous between "the sites are stale" and
# "something unrelated broke".
#
# One decision is computed per run, in the step below, from the event and the
# PR's own diff. Three cases, and the third is the one that matters:
#
#   push to main, a manual run, or         ENFORCED. The sites are compared and
#   a scheduled re-check                   drift fails, exactly as since #21.
#   pull_request, no change to             ENFORCED. Same.
#     packages/predictor-ui
#   pull_request, changes                  PENDING. The sites are still compared
#     packages/predictor-ui                   and the drift is still printed and
#                                            annotated; the run reports them as
#                                            awaiting the re-sync and exits 0.
#
# The first case is where the schedule below lands: `schedule` is not
# `pull_request`, so a re-check enforces exactly as a push does and is not
# softened by being scheduled.
#
# The third case is a deadlock, not a preference. The sites vendor
# packages/predictor-ui by copying it from the hub's main, so a PR that changes
# the package cannot have its sites re-vendor until it merges — while that same
# PR cannot go green until they do. #52 sat on exactly that: its one job red
# with `site-sync: FAIL — 4 of 4 sites are behind the hub`, and no way forward
# except merging, which required the green.
#
# Note what is *not* relaxed. Every site is still read on every run, an unreadable
# one is still a hard failure in every mode, main still enforces the moment the
# bump lands (that red is correct — and under the schedule it also *clears* when
# the four site PRs merge, which is the whole reason the schedule exists), and
# the step fails closed if it cannot compute the diff at all.
# tests/site-sync.test.mjs runs the step below for each of the three cases, and
# pins the scheduled run to the same enforced verdict.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
  # The re-check. Every trigger above fires on a change *to the hub*, but what
  # this check enforces is fixed by a merge in a *site* repo, and no hub event
  # fires when that happens. So the sequence that actually occurs leaves a
  # verdict behind that nothing ever revises:
  #
  #   hub PR bumps packages/predictor-ui  → the PR reports BEHIND, which is
  #                                           correct: the sites cannot vendor a
  #                                           package that is not on main yet
  #   it merges                           → push to main enforces and goes RED
  #                                           for `4 of 4 sites are behind`, also
  #                                           correct, and the fix is a sync PR
  #   the four site PRs merge             → the sites ARE current now, and the
  #                                           hub is never asked again
  #
  # Main then keeps displaying the last hub-side verdict, which after that
  # sequence is a stale `failure` for a state that is really PASS. Observed:
  # `failure 957d0b7` on main while scripts/check-site-sync.mjs reported
  # `PASS — 4 of 4`. A check whose main-branch verdict cannot go green is a check
  # nobody reads.
  #
  # A schedule, and deliberately not `repository_dispatch`, because the failure
  # being closed here is *silent staleness* and a schedule is the one mechanism
  # that cannot reintroduce it:
  #
  #   * Dispatch is immediate, but a site repo's GITHUB_TOKEN is scoped to that
  #     repo and cannot dispatch to another one. It needs a PAT in a secret in
  #     each of the four site repos, an edit to four site workflows, and this
  #     file merged to main first — repository_dispatch only reaches a workflow
  #     on the default branch. Delete or break any one of those four steps and
  #     main goes stale permanently with nothing re-checking it, which is the
  #     failure being fixed rather than a smaller version of it.
  #   * A schedule needs no credential and no other repo's cooperation, so the
  #     only thing that can stop it is the hub itself.
  #
  # The cost of that choice: up to ~6h of extra red on main while the site PRs
  # land. Dispatch buys latency and spends robustness, and staleness — not
  # latency — is what this trigger is for.
  #
  # :17 past the hour, not :00. GitHub's scheduler is best-effort and delays the
  # top of the hour hardest, so scheduling into that slot buys jitter rather than
  # precision.
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read # the automatic GITHUB_TOKEN. Every site repo is public, so an
  #                anonymous read already returns 200 (verified with curl), and
  #                this token is the only credential the check expects.

concurrency:
  # The event name is in the group so the schedule cannot cancel the run that is
  # already enforcing. A scheduled run reads `github.ref` as the default branch,
  # the same ref a push run does, so without this they share a group and
  # cancel-in-progress can mark main's enforcing run "cancelled" — the new
  # trigger weakening the existing one instead of adding to it.
  group: site-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request event checks out the merge commit at depth 1, so
          # `origin/<base>` is not there to diff against. The decision below
          # needs both sides of the diff, so the history has to come with it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # fetch and node:test, no build step
      - name: Decide whether this run enforces
        id: enforce
        env:
          # The event is the whole distinction. `base_ref` is empty on push and
          # on workflow_dispatch, which is exactly right: neither is a PR whose
          # sites are queued behind it.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            # Push to main enforces, always, and it is meant to. The moment a
            # package bump merges, main IS behind until the four site PRs land,
            # and that red is the correct signal: the fix is
            # `node scripts/sync-ui.mjs` on the stale site. It clears itself when
            # they do. Nothing about this step is allowed to soften that.
            enforce=1
            expect_resync=0
          elif changed="$(git diff --name-only "origin/$BASE_REF...HEAD" -- packages/predictor-ui/ 2>&1)"; then
            if [ -n "$changed" ]; then
              # The deadlock, and the only case in which it applies: this PR
              # changes the package, and the sites vendor it from main, so they
              # cannot re-vendor it until this merges — while this PR cannot go
              # green until they do. Reported as pending rather than failed;
              # enforced the moment it lands on main.
              echo "This PR changes packages/predictor-ui, which the sites vendor from main:"
              echo "$changed"
              echo "They cannot re-vendor it until this merges, so this run reports them as pending."
              enforce=0
              expect_resync=1
            else
              enforce=1
              expect_resync=0
            fi
          else
            # Fails closed. If the diff cannot be computed there is no evidence
            # the package is unchanged, and a check that cannot tell must not
            # choose leniency.
            echo "::warning::could not diff origin/$BASE_REF...HEAD ($changed); enforcing rather than assuming the package is unchanged"
            enforce=1
            expect_resync=0
          fi
          echo "enforce=$enforce" >>"$GITHUB_OUTPUT"
          echo "expect_resync=$expect_resync" >>"$GITHUB_OUTPUT"
      - name: Compare each site's SYNC.json against the hub's contentVersion
        env:
          # Unset today, and the check does not need it: all six site repos are
          # public. It is here as the one-line escape hatch, because a
          # GITHUB_TOKEN is an installation token scoped to *this* repository
          # and whether GitHub honours one for a different public repository is
          # not something a local run can answer. If the first run in Actions
          # reports every site unreadable, add a repository secret
          # SITE_REPOS_TOKEN (a PAT with `contents: read` on the site repos)
          # and re-run — nothing else changes.
          SITE_REPOS_TOKEN: ${{ secrets.SITE_REPOS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ENFORCED as of 2026-09-28, and still enforced on main. It shipped as
          # "0" on purpose: adoption is a migration, and a check that lands red
          # on main is a check nobody reads.
          #
          # The precondition is met. All four registered sites now read the version
          # the hub is at:
          #   NBA_Predictor      #10  e4f15576b8e0 -> 9c14c67d91df  (merged 38bd6df)
          #   F1_Predictor       #11  e4f15576b8e0 -> 9c14c67d91df  (merged 498ffde)
          #   PL_Predictor       #5   already current
          #   Sports_Predictor   #5   already current
          # Both re-vendors were checked before syncing, and both were CLEAN, so
          # nothing a person had written by hand was destroyed to get here.
          #
          # Until this flip it could not catch a site falling behind *after* today.
          # It can now. If main goes red, the fix is `node scripts/sync-ui.mjs` on
          # the stale site, not loosening this.
          #
          # The value is the step above's decision and nothing else. A PR that
          # does not change packages/predictor-ui gets "1", and so does every
          # push to main. Only a package-bumping PR gets "0", and only because
          # its sites cannot sync a version that is not on main yet — which is
          # why it also gets SITE_SYNC_EXPECT_RESYNC, so the run reports those
          # sites as PENDING instead of printing the unrelated migration advice.
          ENFORCE_SITE_SYNC: ${{ steps.enforce.outputs.enforce }}
          SITE_SYNC_EXPECT_RESYNC: ${{ steps.enforce.outputs.expect_resync }}
        run: node scripts/check-site-sync.mjs
