# Auto-review every PR to main so the human/agent reviewer is not the only gate.
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!data/**"
    - "!**/package-lock.json"
    - "!**/dist/**"
